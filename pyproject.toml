[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mulk-jarvis"
version = "0.1.0"
description = "Local voice Jarvis for Mulk Allah Alsadi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1.0",
    "google-genai>=1.0.0",
    "edge-tts>=6.1.19",
    "sounddevice>=0.5.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "av>=12.0.0",
]

[project.scripts]
mulk-jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]
